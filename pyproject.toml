[project]
name = "fnquant-kernels"
version = "0.1.0"
description = "TA-Lib-exact per-bar numeric kernels for Python, compiled from Rust."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0"]
keywords = ["ta-lib", "technical-analysis", "numpy", "rust", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/kelsayed17/fnquant-kernels"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "fnquant_kernels._native"
strip = true
# Tests run against what ships: the release build (the wheels' profile), not a debug build with other overflow behaviour.
profile = "release"

[dependency-groups]
dev = [
    # The oracle, pinned exactly: TA-Lib 0.8.3 (2026-10-28) rounds EMA differently from 0.8.1 and 0.8.2, which agree
    # with the reference loops on every period tested. Moving the pin means re-deriving the references.
    "ta-lib==0.8.2",
    "pytest>=9.0.3",
    "pytest-timeout>=2.3",
    "ruff>=0.16.7",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["target"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001", "D203", "D213", "D401", "PLR0913", "PLR0917", "CPY001", "S101", "TRY003",
    "RUF001", "RUF002", "RUF003", "N818",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "INP001", "PLR2004", "PT017"]
"tests/**" = [
    "D100", "D101", "D102", "D103", "D104", "D205", "INP001", "PLR2004", "SLF001", "S311", "B017", "N802", "E741",
    "PLR0915", "C901", "PLR0912", "PLR0911", "SIM108", "FBT003", "A002",
]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["."]

[tool.ty.rules]
all = "error"

[tool.uv]
exclude-newer = "3 days"
