name: Bug report
description: A kernel's output differs from TA-Lib or its reference, or a kernel raises where it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting. For a security problem (a crash or memory corruption reachable from Python), do not
        open an issue: use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The kernel call and the smallest input array that shows it.
      render: python
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `uv pip list | grep -iE "fnquant|numpy|ta-lib"`, `python --version`, and your OS and CPU.
      render: text
    validations:
      required: true
