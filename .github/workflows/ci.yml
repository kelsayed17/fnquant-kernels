name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both Linux architectures are native: the kernels are held byte-for-byte to the references on each.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.14"]
    env:
      PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install "$PYTHON"
      - run: uv sync --python "$PYTHON" --reinstall-package fnquant-kernels
      - run: bash scripts/check.sh

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.85.0"
      - run: cargo check --locked

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: uv audit --frozen --preview-features audit-command
      # The runner's own cargo builds the RustSec checker; it reads Cargo.lock and needs no toolchain beyond that.
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.31.1"
          # Findings fail this check; SARIF mode would exit 0 and leave them to code scanning, which is not required.
          advanced-security: false
